name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PRODUCTS_URL: ${{ secrets.PRODUCTS_URL }}
          TENDERS_URL: ${{ secrets.TENDERS_URL }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          COOKIE_POLICY_URL: ${{ secrets.COOKIE_POLICY_URL }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          REQUESTS_URL: ${{ secrets.REQUESTS_URL }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
